name: flutter_app_template
description: A Flutter Clean Architecture starter template with routing, localization, notifications, flavors, and code generation.
version: 0.1.1

vars:
  project_name:
    type: string
    description: "Dart package name. Natural names are accepted and sanitized to snake_case by the pre_gen hook."
    prompt: "What is the Dart package name? (example: my_app)"
    default: my_app
  project_title:
    type: string
    description: "Human-readable app title used for flavor display names and F.title."
    prompt: "What is the app title? (example: My App)"
    default: My App

  package_name:
    type: string
    description: "Android applicationId / iOS bundle identifier base. It is sanitized to lower-case dotted segments."
    prompt: "What is the package/bundle id? (example: com.example.myapp)"
    default: com.example.myapp

  project_description:
    type: string
    description: Description written into pubspec.yaml
    prompt: Write a short project description.
    default: A Flutter Clean Architecture project.
