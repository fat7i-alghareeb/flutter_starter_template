name: flutter_app_template
description: A Flutter Clean Architecture starter template with routing, localization, notifications, in-app stage tools, and code generation.
version: 0.1.1

vars:
  project_name:
    type: string
    description: "Dart package name. Use valid snake_case, for example my_app."
    prompt: "What is the Dart package name? (example: my_app)"
    default: my_app
  project_title:
    type: string
    description: "Human-readable app title exposed as AppConfig.appTitle."
    prompt: "What is the app title? (example: My App)"
    default: My App

  package_name:
    type: string
    description: "Android applicationId / iOS bundle identifier base, for example com.example.myapp."
    prompt: "What is the package/bundle id? (example: com.example.myapp)"
    default: com.example.myapp

  project_description:
    type: string
    description: Description written into pubspec.yaml
    prompt: Write a short project description.
    default: A Flutter Clean Architecture project.
