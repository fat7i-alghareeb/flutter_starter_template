# Codemagic CI — plain Flutter release builds (no code push).
#
#   android-release-mock  →  APK, USE_MOCK=true (fixtures from assets/mock/),
#                            its own package id and launcher name, so it
#                            installs beside the real app
#   android-release       →  APK, real network
#   android-bundle        →  AAB for Google Play
#   ios-release           →  IPA uploaded to TestFlight
#
# Full walkthrough, with screenshots of every Codemagic screen:
# docs/CODEMAGIC.md. Want over-the-air Dart patches? docs/SHOREBIRD.md turns
# these workflows into Shorebird release/patch ones.
#
# VERSION: pubspec.yaml `version:` is the only source. Bump the +N before a
# release and commit; the stores refuse a build number they have seen.
#
# One-time setup for Android (Team settings → Code signing identities →
# Android keystores): upload the release .jks under the reference name
# `{{project_name}}_release_keystore`. Codemagic then exposes
# CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS and CM_KEY_PASSWORD,
# which the "Set up signing" step writes into android/key.properties — the
# file android/app/build.gradle.kts reads once docs/ANDROID_RELEASE_SETUP.md
# is applied. Without it a release silently falls back to the debug keystore,
# so the step fails the build instead.
#
# One-time setup for iOS: an App Store Connect API key added in Codemagic
# (Team settings → Team integrations → Developer Portal) under the name
# `{{project_name}}_app_store_connect`, and an App Store distribution
# certificate + provisioning profile for {{package_name}} under Code signing
# identities (Codemagic can fetch both through that key).
#
# All workflows are started manually (no triggering block). Add one when you
# want builds on every tag or push.

definitions:
  cache: &cache
    cache_paths:
      - $HOME/.pub-cache
      - $HOME/.gradle/caches

  scripts:
    - &set_up_signing
      name: Set up signing
      script: |
        set -e
        if [ -z "$CM_KEYSTORE_PATH" ]; then
          echo "CM_KEYSTORE_PATH is empty: keystore '{{project_name}}_release_keystore' is not attached." >&2
          exit 1
        fi
        cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
        storePassword=$CM_KEYSTORE_PASSWORD
        keyPassword=$CM_KEY_PASSWORD
        keyAlias=$CM_KEY_ALIAS
        storeFile=$CM_KEYSTORE_PATH
        EOF

    - &get_dependencies
      name: Get dependencies
      # Generated Dart (*.g.dart, *.freezed.dart, injectable.config.dart) is
      # committed, so no build_runner step is needed.
      script: flutter pub get

    - &analyze_and_test
      name: Analyze and test
      # Goldens are excluded: the build machine rasterises text slightly
      # differently from the machine that recorded the baselines.
      script: |
        set -e
        flutter analyze
        flutter test --exclude-tags golden

    - &build_apk
      name: Build APK (arm64, obfuscated)
      # Read a release crash back with:
      #   flutter symbolize -i <stack_trace.txt> -d build/symbols/app.android-arm64.symbols
      script: |
        set -e
        if [ "$APK_VARIANT" = "mock" ]; then
          flutter build apk --release --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=USE_MOCK=true \
            --android-project-arg=appIdSuffix=.mock \
            "--android-project-arg=appLabel={{project_title}} Mock"
        else
          flutter build apk --release --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols
        fi

    - &collect_apk
      name: Collect APK
      script: |
        set -e
        VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^ ]+).*/\1/')
        mkdir -p build/out
        cp build/app/outputs/flutter-apk/app-release.apk \
          "build/out/{{project_name}}-${APK_VARIANT}-arm64-v${VERSION/+/-}.apk"

  artifacts: &artifacts
    - build/out/*.apk
    # Keep these: without the matching symbols / mapping a release stack
    # trace (Dart or Java) is unreadable.
    - build/symbols/*.symbols
    - build/app/outputs/mapping/release/mapping.txt

  publishing: &publishing
    email: &email
      recipients:
        - you@example.com
      notify:
        success: true
        failure: true

  android_environment: &android_environment
    flutter: 3.44.1
    java: 21
    android_signing:
      - {{project_name}}_release_keystore

  ios_environment: &ios_environment
    flutter: 3.44.1
    xcode: latest
    cocoapods: default
    ios_signing:
      distribution_type: app_store
      bundle_identifier: {{package_name}}

workflows:
  android-release-mock:
    name: Android APK (Release, mock data)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *android_environment
      vars:
        APK_VARIANT: mock
    cache: *cache
    scripts:
      - *set_up_signing
      - *get_dependencies
      - *analyze_and_test
      - *build_apk
      - *collect_apk
    artifacts: *artifacts
    publishing: *publishing

  android-release:
    name: Android APK (Release)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *android_environment
      vars:
        APK_VARIANT: release
    cache: *cache
    scripts:
      - *set_up_signing
      - *get_dependencies
      - *analyze_and_test
      - *build_apk
      - *collect_apk
    artifacts: *artifacts
    publishing: *publishing

  android-bundle:
    name: Android App Bundle (Google Play)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment: *android_environment
    cache: *cache
    scripts:
      - *set_up_signing
      - *get_dependencies
      - *analyze_and_test
      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/symbols/*.symbols
      - build/app/outputs/mapping/release/mapping.txt
    publishing: *publishing

  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: {{project_name}}_app_store_connect
    environment: *ios_environment
    cache: *cache
    scripts:
      - *get_dependencies
      - *analyze_and_test
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --obfuscate --split-debug-info=build/symbols \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/symbols/*.symbols
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email: *email
      app_store_connect:
        auth: integration
        submit_to_testflight: true
