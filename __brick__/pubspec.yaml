name: {{project_name}}
description: "{{project_description}}"
publish_to: "none"
# `x.y.z+N`. The build number (+N) is what stores and release tools key on:
# bump it before every release.
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # UI / Design system
  cupertino_icons: ^1.0.9
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  animations: ^3.0.0
  vector_graphics: ^1.2.2

  # State management / DI / Routing
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  go_router: ^18.0.0

  # Networking / Session
  dio: ^5.9.2
  dio_refresh_bot: ^2.2.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  jwt_decoder: ^2.0.1

  # Localization / Intl
  easy_localization: ^3.0.8
  intl: ^0.20.2
  flutter_timezone: ^5.1.0
  intl_phone_number_input: ^0.7.5

  # Forms
  reactive_forms: ^18.2.2

  # Device / Permissions
  permission_handler: ^13.0.1
  vibration: ^3.1.8
  # Pinned: 13.2.0 dropped the Kotlin Gradle Plugin for AGP built-in Kotlin,
  # which an app on `android.builtInKotlin=false` cannot enable
  # (docs/ANDROID_RELEASE_SETUP.md).
  device_info_plus: 13.1.0
  flutter_udid: ^4.1.2

  # Codegen annotations
  freezed_annotation: ^3.1.0
  flutter_local_notifications: ^22.0.0
  firebase_messaging: ^16.3.0
  firebase_core: ^4.10.0
  timezone: ^0.11.0
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path_provider: ^2.1.5
  device_preview_plus: ^2.8.1

  # Desktop window: the custom title bar, hidden-until-first-frame launch,
  # minimum size and window state (`docs/DESKTOP_SETUP.md`). No code on
  # Android or iOS: every call sits behind `AppPlatform.hasDesktopWindow`.
  window_manager: ^0.5.2
  # The displays, to put a remembered window back on a screen that exists.
  screen_retriever: ^0.2.2
  # A second launch on Windows focuses the running window instead.
  windows_single_instance: ^1.2.0
  # Links that open the desktop app: myapp://items/42 (Windows, macOS).
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # End-to-end tests that drive a real build on a device or emulator.
  integration_test:
    sdk: flutter

  # Testing
  # mocktail over mockito: no codegen step, so a fake never goes stale after a
  # signature change — the compiler catches it instead of build_runner.
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

  # Lints
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.15.0
  injectable_generator: ^3.0.2
  freezed: ^3.2.5
  flutter_gen_runner: ^5.14.1
  vector_graphics_compiler: ^1.2.5

  # Tooling
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  # Windows: the MSIX package for the Microsoft Store and for sideloading
  # (`dart run msix:create`, docs/DESKTOP_SETUP.md).
  msix: ^3.18.0
  objectbox_generator: ^5.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/images/
    - path: assets/svgIcons/
      transformers:
        - package: vector_graphics_compiler
    - assets/icons/
    - assets/fonts/
    # Fixtures for the local mock layer (--dart-define=USE_MOCK=true).
    # Flutter does NOT include sub-folders on its own: list every
    # assets/mock/<feature>/ folder here. `dart run tool/generate_feature.dart
    # <name> --mock` prints the line to add.
    - assets/mock/showcase/

  fonts:
    # Bundled rather than fetched at runtime: a network font means a flash of
    # unstyled text on the first launch and a silent Roboto fallback offline.
    # Tajawal covers Arabic and Latin with one rhythm (SIL OFL 1.1, see
    # assets/fonts/OFL.txt).
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800

flutter_gen:
  output: lib/utils/gen/

# Windows MSIX package — `dart run msix:create`.
#
# - The version follows `version:` above (1.0.0+1 → 1.0.0.1): one place to bump.
# - Without a certificate the tool makes a self-signed test one and installs
#   it on THIS PC, so the package installs here. For other PCs, sign with your
#   own certificate (`certificate_path`), or publish through the Microsoft
#   Store (`dart run msix:create --store`): the Store signs it for you, and
#   registration is free for individuals.
# - Notifications on Windows need this package identity to be cancelled or
#   listed (flutter_local_notifications); a plain `flutter run` cannot.
# - `logo_path`: your 400×400+ app icon, when you have one.
msix_config:
  display_name: "{{project_title}}"
  publisher_display_name: "{{project_title}}"
  identity_name: "{{package_name}}"
  capabilities: internetClient
  languages: en-us, ar-sa
  # Keep equal to `AppLinks.scheme` (lib/core/router/app_links.dart).
  protocol_activation: myapp
  architecture: x64
  # logo_path: assets/images/app_icon.png

# Launcher icon and native splash are configured in their own files at the
# project root — flutter_launcher_icons.yaml and flutter_native_splash.yaml —
# because both tools prefer a standalone file when it exists.
#   dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
#   dart run flutter_native_splash:create --path flutter_native_splash.yaml
