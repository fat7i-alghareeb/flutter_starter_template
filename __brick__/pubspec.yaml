name: {{{project_name_yaml}}}
description: {{{project_description_yaml}}}
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # UI / Design system
  cupertino_icons: ^1.0.9
  cached_network_image: ^3.4.1
  google_fonts: ^8.1.0
  flutter_screenutil: ^5.9.3
  flutter_animate: ^4.5.2
  animations: ^2.2.0
  shimmer: ^3.0.0
  vector_graphics: ^1.2.2

  # State management / DI / Routing
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  go_router: ^17.3.0

  # Networking / Session
  dio: ^5.9.2
  dio_refresh_bot: ^2.2.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  jwt_decoder: ^2.0.1

  # Localization / Intl
  easy_localization: ^3.0.8
  intl: ^0.20.2
  flutter_timezone: ^5.1.0
  intl_phone_number_input: ^0.7.5

  # Forms
  reactive_forms: ^18.2.2

  # Device / Permissions
  permission_handler: ^12.0.3
  vibration: ^3.1.8
  device_info_plus: ^13.1.0
  flutter_udid: ^4.1.2

  # Codegen annotations
  freezed_annotation: ^3.1.0
  font_awesome_flutter: ^11.0.0
  flutter_local_notifications: ^22.0.0
  firebase_messaging: ^16.3.0
  firebase_core: ^4.10.0
  timezone: ^0.11.0
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path_provider: ^2.1.5
  device_preview_plus: ^2.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.15.0
  injectable_generator: ^3.0.2
  freezed: ^3.2.5
  flutter_gen_runner: ^5.14.1
  vector_graphics_compiler: ^1.2.5

  # Tooling
  flutter_flavorizr: ^2.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  objectbox_generator: ^5.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/images/
    - path: assets/svgIcons/
      transformers:
        - package: vector_graphics_compiler
    - assets/icons/

flutter_gen:
  output: lib/utils/gen/

# dart run flutter_flavorizr
flavorizr:
  flavors:
    stage:
      app:
        name: {{{stage_project_title_yaml}}}
        package_name: {{{stage_package_name_yaml}}}
      android:
        applicationId: {{{stage_package_name_yaml}}}
    production:
      app:
        name: {{{project_title_yaml}}}
        package_name: {{{package_name_yaml}}}
      android:
        applicationId: {{{package_name_yaml}}}
  instructions:
    - android:androidManifest
    - android:flavorizrGradle
    - android:buildGradle
    - flutter:flavors
    - ide:config
