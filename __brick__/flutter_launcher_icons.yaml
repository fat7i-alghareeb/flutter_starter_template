# App icon. Put a 1024×1024 PNG (no transparency for iOS) at
# assets/images/app_icon.png — and, for Android's adaptive icon, a foreground
# with the logo inside the centre 66% at assets/images/app_icon_foreground.png
# — then run:
#   dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
#
# The images are NOT shipped with the template: every app needs its own.

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"

  android: "ic_launcher"
  min_sdk_android: 24
  adaptive_icon_background: "#F5F6F8"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  # A single-colour version for Android 13+ themed icons (optional):
  # adaptive_icon_monochrome: "assets/images/app_icon_monochrome.png"

  ios: true
  remove_alpha_ios: true
