<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Architecture layers">
  <style>
    svg{--bg:#F5F6F8;--card:#FFFFFF;--fg:#1B1F27;--mu:#5B6272;--line:#E3E6EC}
    @media (prefers-color-scheme:dark){svg{--bg:#0F1115;--card:#171A21;--fg:#E8EAF0;--mu:#A0A7B6;--line:#2A2F3A}}
    .n{font:800 18px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#fff} .d{font:500 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--fg)}
    .l{opacity:0;animation:in .6s ease-out forwards}
    @keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
    .flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <rect width="900" height="420" rx="24" fill="var(--bg)"/>
<g class="l" style="animation-delay:0.0s">
  <rect x="30" y="30" width="840" height="76" rx="18" fill="var(--card)" stroke="var(--line)"/>
  <rect x="30" y="30" width="190" height="76" rx="18" fill="#3B5BDB"/><rect x="200" y="30" width="20" height="76" fill="#3B5BDB"/>
  <text x="125" y="74" text-anchor="middle" class="n">presentation</text>
  <text x="244" y="74" class="d">Screen → body → SkeletonWidget cards · Bloc + freezed · one BlocStatus per operation</text>
</g>
<line class="flow" x1="125" y1="106" x2="125" y2="126" stroke="var(--mu)" stroke-width="2.5"/>
<g class="l" style="animation-delay:0.15s">
  <rect x="30" y="126" width="840" height="76" rx="18" fill="var(--card)" stroke="var(--line)"/>
  <rect x="30" y="126" width="190" height="76" rx="18" fill="#5C6B8A"/><rect x="200" y="126" width="20" height="76" fill="#5C6B8A"/>
  <text x="125" y="170" text-anchor="middle" class="n">domain</text>
  <text x="244" y="170" class="d">Entities · repository contracts · facades — no Flutter, no Dio</text>
</g>
<line class="flow" x1="125" y1="202" x2="125" y2="222" stroke="var(--mu)" stroke-width="2.5"/>
<g class="l" style="animation-delay:0.3s">
  <rect x="30" y="222" width="840" height="76" rx="18" fill="var(--card)" stroke="var(--line)"/>
  <rect x="30" y="222" width="190" height="76" rx="18" fill="#1F6FA3"/><rect x="200" y="222" width="20" height="76" fill="#1F6FA3"/>
  <text x="125" y="266" text-anchor="middle" class="n">data</text>
  <text x="244" y="266" class="d">Remote / local data sources · models · mappers · repository impl (runAsResult)</text>
</g>
<line class="flow" x1="125" y1="298" x2="125" y2="318" stroke="var(--mu)" stroke-width="2.5"/>
<g class="l" style="animation-delay:0.44999999999999996s">
  <rect x="30" y="318" width="840" height="76" rx="18" fill="var(--card)" stroke="var(--line)"/>
  <rect x="30" y="318" width="190" height="76" rx="18" fill="#2E7D4F"/><rect x="200" y="318" width="20" height="76" fill="#2E7D4F"/>
  <text x="125" y="362" text-anchor="middle" class="n">core</text>
  <text x="244" y="362" class="d">Dio + interceptors (mock → offline cache → JWT) · router · DI · session · theme · l10n</text>
</g>
</svg>