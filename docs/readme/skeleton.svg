<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="One layout for loading and loaded: the skeleton sweeps, then the real card rises in at the same size">
  <defs>
    <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="40" y="70" width="680" height="130" rx="18"/></clipPath>
  </defs>
  <style>
    svg{--bg:#F5F6F8;--card:#FFFFFF;--fg:#1B1F27;--mu:#5B6272;--line:#E3E6EC;--sk:#E3E6EC;--skd:#CDD2DC;--ac:#3B5BDB;--acc:#E3E8FB}
    @media (prefers-color-scheme:dark){svg{--bg:#0F1115;--card:#171A21;--fg:#E8EAF0;--mu:#A0A7B6;--line:#2A2F3A;--sk:#2A2F3A;--skd:#3A404D;--ac:#9DB0FF;--acc:#28366E}}
    .t{font:700 20px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--fg)} .m{font:400 15px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--mu)} .bd{font:700 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--ac)}
    .code{font:600 15px ui-monospace,Consolas,monospace;fill:var(--mu)}
    .skel{animation:sk 5s ease infinite} .real{animation:re 5s ease infinite}
    @keyframes sk{0%,50%{opacity:1}58%,100%{opacity:0}}
    @keyframes re{0%,52%{opacity:0;transform:translateY(8px)}62%,94%{opacity:1;transform:none}100%{opacity:0}}
    .sweep{animation:swp 1.4s linear infinite}
    @keyframes swp{from{transform:translateX(-300px)}to{transform:translateX(760px)}}
    .a{animation:ca 5s ease infinite} .b{animation:cb 5s ease infinite}
    @keyframes ca{0%,50%{opacity:1}56%,100%{opacity:0}} @keyframes cb{0%,52%{opacity:0}58%,96%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.skel{opacity:0}}
  </style>
  <rect width="760" height="250" rx="24" fill="var(--bg)"/>
  <text x="40" y="46" class="code a">const FeedCard.loading()</text>
  <text x="40" y="46" class="code b">FeedCard.success(item: item)  // same size, nothing jumps</text>
  <rect x="40" y="70" width="680" height="130" rx="18" fill="var(--card)" stroke="var(--line)"/>
  <g class="skel">
    <rect x="60" y="90" width="90" height="90" rx="14" fill="var(--skd)"/>
    <rect x="170" y="94" width="64" height="20" rx="7" fill="var(--sk)"/>
    <rect x="170" y="124" width="420" height="16" rx="8" fill="var(--sk)"/>
    <rect x="170" y="148" width="260" height="12" rx="6" fill="var(--sk)"/>
    <rect x="170" y="168" width="340" height="12" rx="6" fill="var(--sk)"/>
    <g clip-path="url(#c)"><rect class="sweep" x="0" y="70" width="260" height="130" fill="url(#sw)"/></g>
  </g>
  <g class="real">
    <rect x="60" y="90" width="90" height="90" rx="14" fill="var(--acc)"/>
    <g transform="translate(89 119) scale(1.35)" fill="none" stroke="var(--ac)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18h-5" />
  <path d="M18 14h-8" />
  <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2" />
  <rect width="8" height="4" x="10" y="6" rx="1" /></g>
    <rect x="170" y="94" width="58" height="22" rx="7" fill="var(--acc)"/><text x="199" y="110" text-anchor="middle" class="bd">News</text>
    <text x="170" y="140" class="t">Community garden opens its doors</text>
    <text x="170" y="162" class="m">Maya Chen · 2h ago</text>
    <text x="170" y="184" class="m">Free seedlings for the first hundred visitors.</text>
  </g>
</svg>