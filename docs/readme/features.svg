<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 592" width="1180" height="592" role="img" aria-label="What you get">
    <style>
      .t{font:700 19px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--fg)}
      .b{font:400 14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:var(--mu)}
      .card{opacity:0;animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards}
      @keyframes pop{from{opacity:0;transform:translateY(22px) scale(.92)}to{opacity:1;transform:none}}
      svg{--bg:#F5F6F8;--card:#FFFFFF;--fg:#1B1F27;--mu:#5B6272;--line:#E3E6EC;--disc:#E3E8FB;--ic:#3B5BDB}
      @media (prefers-color-scheme:dark){svg{--bg:#0F1115;--card:#171A21;--fg:#E8EAF0;--mu:#A0A7B6;--line:#2A2F3A;--disc:#28366E;--ic:#9DB0FF}}
      @media (prefers-reduced-motion:reduce){.card{animation:none;opacity:1}}
    </style>
<rect width="1180" height="592" rx="24" fill="var(--bg)"/>
<g class="card" style="animation-delay:0.00s;transform-origin:210.0px 89.0px">
  <rect x="30" y="30" width="360" height="118" rx="18" fill="var(--card)" stroke="var(--line)"/>
  <circle cx="76" cy="89.0" r="26" fill="var(--disc)"/>
  <g transform="translate(64 77.0)" fill="none" stroke="var(--ic)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1" />
  <rect width="7" height="7" x="14" y="3" rx="1" />
